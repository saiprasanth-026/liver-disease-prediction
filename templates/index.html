<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Liver Disease Prediction System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🩺 Liver Disease Prediction System</h1>
        <p>Enter a patient's liver function test values to get an instant ML-based prediction</p>
    </div>

    <form action="/predict" method="POST">
        <div class="grid">
            <div class="field">
                <label>Age</label>
                <input type="number" name="Age" value="45" min="1" max="100" required>
            </div>
            <div class="field">
                <label>Gender</label>
                <select name="Gender" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div class="field">
                <label>Total Bilirubin (mg/dL)</label>
                <input type="number" step="0.01" name="Total_Bilirubin" value="1.0" required>
            </div>
            <div class="field">
                <label>Direct Bilirubin (mg/dL)</label>
                <input type="number" step="0.01" name="Direct_Bilirubin" value="0.3" required>
            </div>
            <div class="field">
                <label>Alkaline Phosphotase (IU/L)</label>
                <input type="number" name="Alkaline_Phosphotase" value="180" required>
            </div>
            <div class="field">
                <label>Alamine Aminotransferase (ALT)</label>
                <input type="number" name="Alamine_Aminotransferase" value="30" required>
            </div>
            <div class="field">
                <label>Aspartate Aminotransferase (AST)</label>
                <input type="number" name="Aspartate_Aminotransferase" value="30" required>
            </div>
            <div class="field">
                <label>Total Proteins (g/dL)</label>
                <input type="number" step="0.01" name="Total_Proteins" value="6.8" required>
            </div>
            <div class="field">
                <label>Albumin (g/dL)</label>
                <input type="number" step="0.01" name="Albumin" value="3.5" required>
            </div>
            <div class="field">
                <label>Albumin/Globulin Ratio</label>
                <input type="number" step="0.01" name="Albumin_and_Globulin_Ratio" value="1.1" required>
            </div>
        </div>

        <button class="btn" type="submit">🔍 Predict Diagnosis</button>
    </form>

    <div class="footer-note">Built with Python · Scikit-learn (Random Forest) · Flask &nbsp;|&nbsp; Demo dataset — not for real medical use</div>
</div>
</body>
</html>
